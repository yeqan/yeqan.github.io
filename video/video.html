<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <title>video</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <style>
    /* 重置默认样式，避免边距影响 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding: 20px;
      background-color: #f5f5f5;
    }

    /* 视频容器：控制最大宽度，实现自适应核心 */
    .videoContainer {
      /* 最大宽度限制，避免电脑端视频过宽 */
      max-width: 1200px;
      /* 水平居中 */
      margin: 0 auto;
      /* 相对定位，用于配合视频绝对定位 */
      position: relative;
      /* 关键：通过padding-top固定视频比例（以16:9为例，计算方式：9/16*100% = 56.25%） */
      /* 若需其他比例，可修改数值：4:3→75%，3:4→133.33% */
      padding-top: 56.25%;
    }

    /* 视频元素：自适应容器，保持比例 */
    #videoPlayer {
      /* 绝对定位，填充容器 */
      position: absolute;
      top: 0;
      left: 0;
      /* 宽度和高度100%，填满容器 */
      width: 100%;
      height: 100%;
      /* 圆角优化视觉，可选 */
      border-radius: 8px;
      /* 阴影增强层次感，可选 */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <div class="videoContainer">
    <video id="videoPlayer" preload="none" controls muted preload="metadata"></video>
  </div>
  <script src="../js/crypto-js.min.js"></script>
  <script>

    function reverseStr(str) {
      // 处理 null/undefined/非字符串类型，避免报错
      if (typeof str !== 'string' || str === '') return str;
      return str.split('').reverse().join('');
    }

    const videoPlayer = document.getElementById('videoPlayer');
    const params = new URLSearchParams(window.location.search);
    const path = params.get('path');
    const key = params.get('key');

    const DES_KEY = CryptoJS.enc.Utf8.parse(key); // 8字节密钥
    const DES_IV = CryptoJS.enc.Utf8.parse(reverseStr(key));  // 8字节IV向量
    const ENCRYPTED_VIDEO_PATH = path + ".mp4.enc"; // 加密视频文件路径

    // 核心：DES-CBC解密函数（处理单块数据）
    function decryptDesBlock(cipherText) {
      const decrypted = CryptoJS.DES.decrypt(
        { ciphertext: cipherText }, // 密文（WordArray格式）
        DES_KEY,
        {
          iv: DES_IV,
          mode: CryptoJS.mode.CBC,
          padding: CryptoJS.pad.Pkcs7 // PKCS5与PKCS7补位兼容（Java PKCS5对应JS PKCS7）
        }
      );
      return decrypted.toString(CryptoJS.enc.Uint8Array); // 解密后转为Uint8Array
    }

    // 分块读取加密文件 + 解密 + 生成Blob播放流
    async function decryptAndPlayVideo() {
      console.log(key)
      console.log(reverseStr(key))
      try {
        // 1. 读取加密视频文件
        const response = await fetch(ENCRYPTED_VIDEO_PATH);
        if (!response.ok) throw new Error('读取加密视频失败');

        const reader = response.body.getReader();
        const chunkSize = 8192;
        const chunks = []; // 存储解密后的二进制块

        // 2. 分块读取并解密
        while (true) {
          // 主动创建8KB缓冲区，强制每次只读8KB（和Java对齐）
          const buffer = new Uint8Array(chunkSize);
          const { done, value } = await reader.read(buffer);

          if (done) break;

          // 注意：value可能小于CHUNK_SIZE（最后一个分片可能不足8KB）
          const actualChunk = value.subarray(0, value.byteLength); // 实际读取的分片
          const cipherText = CryptoJS.lib.WordArray.create(actualChunk);
          const decryptedChunk = decryptDesBlock(cipherText);

          chunks.push(decryptedChunk);
        }

        // 3. 合并所有解密后的块，生成Blob（视频格式为mp4，需与原视频一致）
        const mergedBuffer = new Uint8Array(chunks.reduce((total, chunk) => total + chunk.length, 0));
        let offset = 0;
        for (const chunk of chunks) {
          mergedBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        const videoBlob = new Blob([mergedBuffer], { type: 'video/mp4' });

        // 4. 生成Blob URL，赋值给video标签播放
        const videoUrl = URL.createObjectURL(videoBlob);
        videoPlayer.src = videoUrl;
        videoPlayer.load();
      } catch (error) {
        console.error('解密或播放失败：', error);
      }
    }

    // 页面加载完成后执行解密播放
    window.onload = decryptAndPlayVideo;

  </script>
</body>

</html>
