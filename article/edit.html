<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIT</title>
    <script src="../js/crypto-js.min.js"></script>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome图标 -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 配置Tailwind自定义样式 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        editor: '#F9FAFB',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Consolas', 'Monaco', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .editor-height {
                height: calc(100vh - 140px);
                min-height: 400px;
            }
            .scrollbar-slim::-webkit-scrollbar {
                width: 4px;
                height: 4px;
            }
            .scrollbar-slim::-webkit-scrollbar-thumb {
                background-color: rgba(156, 163, 175, 0.5);
                border-radius: 2px;
            }
            .scrollbar-slim::-webkit-scrollbar-track {
                background: transparent;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa fa-file-text-o text-primary text-2xl"></i>
                <h1 class="text-xl font-bold text-gray-800">EDIT</h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="saveBtn"
                    class="flex items-center gap-1 px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors">
                    <span class="hidden sm:inline">保存</span>
                    <i class="fa fa-save"></i>
                </button>
                <button id="copyBtn"
                    class="flex items-center gap-1 px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors">
                    <span class="hidden sm:inline">复制</span>
                    <i class="fa fa-copy"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6">
        <!-- 编辑区 -->
        <div class="bg-editor rounded-lg shadow-sm overflow-hidden">
            <div class="px-4 py-2 bg-gray-100 border-b border-gray-200 flex justify-between items-center">
                <span class="text-sm font-medium text-gray-600">编辑区</span>
                <span class="text-xs text-gray-500" id="countDisplay">字数：0 | 选中：0</span>
            </div>
            <textarea id="editor"
                class="w-full editor-height p-4 font-mono text-sm bg-editor scrollbar-slim outline-none resize-none"
                placeholder="请输入Markdown文本..."></textarea>
        </div>
    </main>

    <script>
        // 获取DOM元素
        const editor = document.getElementById('editor');
        const saveBtn = document.getElementById('saveBtn');
        const copyBtn = document.getElementById('copyBtn');
        const countDisplay = document.getElementById('countDisplay');
        
        // 获取URL参数
        const params = new URLSearchParams(window.location.search);
        const deckey = params.get('deckey');
        const enckey = params.get('enckey');
        const path = params.get('path');

        const font = params.get('font');

        // 动态设置编辑区字体
        if (font) {
            // 兼容字体名称格式，保留原有降级字体
            const fontFamilies = [
                decodeURIComponent(font), // 解码URL中的字体名称（处理空格转义）
                'Consolas', 
                'Monaco', 
                'monospace'
            ].join(', ');
            editor.style.fontFamily = fontFamilies;
        }

        // 存储总字数和选中字数的状态
        let totalWordCount = 0;
        let selectedWordCount = 0;

        function renderCountDisplay() {
            countDisplay.textContent = `字数：${totalWordCount} | 选中：${selectedWordCount}`;
        }

        // 选中字数统计函数
        function updateSelectedWordCount() {
            // 仅在编辑区有焦点时统计选中字数
            if (document.activeElement !== editor) {
                selectedWordCount = 0;
                renderCountDisplay();
                return;
            }
            // 获取选中文本并去除首尾空白符
            const selection = window.getSelection();
            const selectedText = selection.toString().trim();
            // 更新选中字数状态
            selectedWordCount = selectedText.length;
            // 重新渲染显示
            renderCountDisplay();
        }

        // 字数统计
        editor.addEventListener('input', function() {
            // 更新总字数状态
            totalWordCount = this.value.trim().length;
            // 输入时重置选中字数（输入会取消选中状态）
            selectedWordCount = 0;
            // 更新显示
            renderCountDisplay();
        });

        // 鼠标松开时（鼠标选择文本结束）
        editor.addEventListener('mouseup', updateSelectedWordCount);
        // 键盘操作时（如shift+箭头选择、ctrl+a全选）
        editor.addEventListener('keyup', function(e) {
            // 监听方向键、shift、ctrl/meta（mac）键操作
            if (['Shift', 'Control', 'Meta', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'a'].includes(e.key)) {
                updateSelectedWordCount();
            }
        });
        // 全局选区变化监听（兼容更多选择场景）
        document.addEventListener('selectionchange', updateSelectedWordCount);

        // 保存文件
        saveBtn.addEventListener('click', function () {
            if (!editor.value.trim()) {
                alert('请输入内容后再保存！');
                return;
            }

            // 加密处理
            const editValue = enckey 
                ? CryptoJS.DES.encrypt(editor.value, enckey).toString()
                : editor.value;

            // 创建并下载文件
            const blob = new Blob([editValue], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `markdown_${new Date().getTime()}.txt`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);

            alert('保存成功！');
        });

        // 复制文本
        copyBtn.addEventListener('click', async function () {
            // 检查编辑区是否有内容
            if (!editor.value.trim()) {
                alert('请输入内容后再复制！');
                return;
            }

            // 根据enckey判断是否加密后再复制
            const copyContent = enckey 
                ? CryptoJS.DES.encrypt(editor.value, enckey).toString()  // 加密后复制
                : editor.value;  // 复制原始内容

            try {
                // 将内容复制到剪贴板
                await navigator.clipboard.writeText(copyContent);
                // 提示区分加密/未加密复制
                alert('复制成功！');
            } catch (error) {
                // 兼容备用方案（如果剪贴板API失败）
                console.error('剪贴板复制失败:', error);
                // 手动创建textarea复制
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = copyContent;
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextarea);
                
                // 再次检查是否复制成功并提示
                const isSuccess = document.execCommand('copy');
                if (isSuccess) {
                    alert('复制成功！');
                } else {
                    alert('复制失败，请手动复制内容');
                }
            }
        });

        // 初始化加载文件
        window.addEventListener('DOMContentLoaded', function () {
            if (path) {
                fetch(`${path}.html`)
                    .then(response => {
                        if (!response.ok) throw new Error("无法加载文件");
                        return response.text();
                    })
                    .then(html => {
                        // 解密处理
                        editor.value = deckey 
                            ? CryptoJS.DES.decrypt(html, deckey).toString(CryptoJS.enc.Utf8)
                            : html;
                        // 更新总字数状态
                        totalWordCount = editor.value.trim().length;
                        // 初始化显示
                        renderCountDisplay();
                    })
                    .catch(error => console.error("加载失败：", error));
            }
            updateSelectedWordCount();
        });
    </script>
</body>
</html>
