<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIT</title>
    <script src="../js/crypto-js.min.js"></script>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome图标 -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 配置Tailwind自定义样式 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        editor: '#F9FAFB',
                        // 夜间模式颜色
                        dark: {
                            bg: '#1E1E2E',
                            card: '#2D2D3F',
                            text: '#E2E8F0',
                            border: '#404059',
                            editor: '#282838',
                            hover: '#383850'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Consolas', 'Monaco', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .editor-height {
                height: calc(100vh - 140px);
                min-height: 400px;
            }
            .scrollbar-slim::-webkit-scrollbar {
                width: 4px;
                height: 4px;
            }
            .scrollbar-slim::-webkit-scrollbar-thumb {
                background-color: rgba(156, 163, 175, 0.5);
                border-radius: 2px;
            }
            .scrollbar-slim::-webkit-scrollbar-track {
                background: transparent;
            }
            /* 夜间模式滚动条 */
            .dark .scrollbar-slim::-webkit-scrollbar-thumb {
                background-color: rgba(100, 116, 139, 0.5);
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased transition-colors duration-300" id="appBody">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-10 transition-colors duration-300" id="header">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold text-gray-800 transition-colors duration-300" id="headerTitle">EDIT</h1>
            </div>
            <div class="flex items-center gap-3">
                <!-- 夜间模式切换按钮 -->
                <button id="themeToggleBtn"
                    class="flex items-center gap-1 px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors">
                    <span class="hidden sm:inline" id="themeText">夜间模式</span>
                    <i class="fa fa-moon-o" id="themeIcon"></i>
                </button>
                <button id="saveBtn"
                    class="flex items-center gap-1 px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors">
                    <span class="hidden sm:inline">保存</span>
                    <i class="fa fa-save"></i>
                </button>
                <button id="copyBtn"
                    class="flex items-center gap-1 px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors" id="copyBtnEl">
                    <span class="hidden sm:inline">复制</span>
                    <i class="fa fa-copy"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6 transition-colors duration-300" id="mainContent">
        <!-- 编辑区 -->
        <div class="bg-editor rounded-lg shadow-sm overflow-hidden transition-colors duration-300" id="editorContainer">
            <div class="px-4 py-2 bg-gray-100 border-b border-gray-200 flex justify-between items-center transition-colors duration-300" id="editorHeader">
                <span class="text-sm font-medium text-gray-600 transition-colors duration-300" id="editorLabel">编辑区</span>
                <span class="text-xs text-gray-500 transition-colors duration-300" id="countDisplay">字数：0 | 选中：0</span>
            </div>
            <textarea id="editor"
                class="w-full editor-height p-4 font-mono text-sm bg-editor scrollbar-slim outline-none resize-none transition-colors duration-300"></textarea>
        </div>
    </main>

    <script>
        // 获取DOM元素
        const editor = document.getElementById('editor');
        const saveBtn = document.getElementById('saveBtn');
        const copyBtn = document.getElementById('copyBtn');
        const countDisplay = document.getElementById('countDisplay');
        // 夜间模式相关DOM元素
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const appBody = document.getElementById('appBody');
        const header = document.getElementById('header');
        const headerTitle = document.getElementById('headerTitle');
        const mainContent = document.getElementById('mainContent');
        const editorContainer = document.getElementById('editorContainer');
        const editorHeader = document.getElementById('editorHeader');
        const editorLabel = document.getElementById('editorLabel');
        const themeText = document.getElementById('themeText');
        const themeIcon = document.getElementById('themeIcon');
        const copyBtnEl = document.getElementById('copyBtnEl');
        
        // 获取URL参数
        const params = new URLSearchParams(window.location.search);
        const deckey = params.get('deckey');
        const enckey = params.get('enckey');
        const path = params.get('path');
        const font = params.get('font');

        // 动态设置编辑区字体
        if (font) {
            // 兼容字体名称格式，保留原有降级字体
            const fontFamilies = [
                decodeURIComponent(font), // 解码URL中的字体名称（处理空格转义）
                'Consolas', 
                'Monaco', 
                'monospace'
            ].join(', ');
            editor.style.fontFamily = fontFamilies;
        }

        // 存储总字数和选中字数的状态
        let totalWordCount = 0;
        let selectedWordCount = 0;
        // 存储夜间模式状态
        let isDarkMode = false;

        let lastCountText = ''; // 缓存上次的显示文本
        function renderCountDisplay() {
            const newText = `字数：${totalWordCount} | 选中：${selectedWordCount}`;
            if (newText !== lastCountText) { // 仅数值变化时更新DOM
                countDisplay.textContent = newText;
                lastCountText = newText;
            }
        }

        // 防抖函数
        function debounce(fn, delay = 100) {
            let timer = null;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // 选中字数统计函数
        function updateSelectedWordCount() {
            // 仅在编辑区有焦点时统计选中字数
            if (document.activeElement !== editor) {
                selectedWordCount = 0;
                renderCountDisplay();
                return;
            }
            // 获取选中文本并去除首尾空白符
            const selection = window.getSelection();
            const selectedText = selection.toString().trim();
            // 更新选中字数状态
            selectedWordCount = selectedText.length;
            // 重新渲染显示
            renderCountDisplay();
        }

        // 字数统计（防抖100ms，避开拼音输入的高频触发）
        const debouncedInputHandler = debounce(function() {
            // 更新总字数状态
            totalWordCount = this.value.length;
            // 输入时重置选中字数（输入会取消选中状态）
            selectedWordCount = 0;
            // 更新显示
            renderCountDisplay();
        }, 100);
        editor.addEventListener('input', debouncedInputHandler);

        const debouncedSelectionUpdate = debounce(updateSelectedWordCount, 50);
        // 鼠标松开时（鼠标选择文本结束）
        editor.addEventListener('mouseup', debouncedSelectionUpdate);
        // 键盘操作时（如shift+箭头选择、ctrl+a全选）
        editor.addEventListener('keyup', function(e) {
            // 监听方向键、shift、ctrl/meta（mac）键操作
            if (['Shift', 'Control', 'Meta', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'a'].includes(e.key)) {
                debouncedSelectionUpdate();
            }
        });
        // 全局选区变化监听（兼容更多选择场景）
        document.addEventListener('selectionchange', debouncedSelectionUpdate);

        // 保存文件
        saveBtn.addEventListener('click', function () {
            if (!editor.value.trim()) {
                alert('请输入内容后再保存！');
                return;
            }

            // 加密处理
            const editValue = enckey 
                ? CryptoJS.DES.encrypt(editor.value, enckey).toString()
                : editor.value;

            // 创建并下载文件
            const blob = new Blob([editValue], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            if(path != null) {
                a.download = `${path}.txt`;
            } else {
                a.download = `text_${new Date().getTime()}.txt`;
            }
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        });

        // 复制文本
        copyBtn.addEventListener('click', async function () {
            // 检查编辑区是否有内容
            if (!editor.value.trim()) {
                alert('请输入内容后再复制！');
                return;
            }

            // 根据enckey判断是否加密后再复制
            const copyContent = enckey 
                ? CryptoJS.DES.encrypt(editor.value, enckey).toString()  // 加密后复制
                : editor.value;  // 复制原始内容

            try {
                // 将内容复制到剪贴板
                await navigator.clipboard.writeText(copyContent);
                // 提示区分加密/未加密复制
                alert('复制成功！');
            } catch (error) {
                // 兼容备用方案（如果剪贴板API失败）
                console.error('剪贴板复制失败:', error);
                // 手动创建textarea复制
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = copyContent;
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextarea);
                
                // 再次检查是否复制成功并提示
                const isSuccess = document.execCommand('copy');
                if (isSuccess) {
                    alert('复制成功！');
                } else {
                    alert('复制失败，请手动复制内容');
                }
            }
        });

        // 初始化加载文件
        window.addEventListener('DOMContentLoaded', function () {
            if (path) {
                fetch(`${path}.html`)
                    .then(response => {
                        if (!response.ok) throw new Error("无法加载文件");
                        return response.text();
                    })
                    .then(html => {
                        // 解密处理
                        editor.value = deckey 
                            ? CryptoJS.DES.decrypt(html, deckey).toString(CryptoJS.enc.Utf8)
                            : html;
                        // 更新总字数状态
                        totalWordCount = editor.value.trim().length;
                        // 初始化显示
                        renderCountDisplay();
                    })
                    .catch(error => console.error("加载失败：", error));
            }
            updateSelectedWordCount();
            
            // 检查本地存储的主题偏好
            const savedTheme = localStorage.getItem('editorTheme');
            if (savedTheme === 'dark') {
                toggleDarkMode(true);
            }
        });

        // 切换夜间模式函数
        function toggleDarkMode(forceDark = null) {
            // 确定当前模式
            isDarkMode = forceDark !== null ? forceDark : !isDarkMode;
            
            // 更新DOM样式
            if (isDarkMode) {
                // 夜间模式样式
                appBody.classList.remove('bg-gray-50', 'text-gray-800');
                appBody.classList.add('bg-dark-bg', 'text-dark-text');
                header.classList.remove('bg-white', 'shadow-sm');
                header.classList.add('bg-dark-card', 'shadow-none', 'border-b', 'border-dark-border');
                headerTitle.classList.remove('text-gray-800');
                headerTitle.classList.add('text-dark-text');
                mainContent.classList.remove('text-gray-800');
                mainContent.classList.add('text-dark-text');
                editorContainer.classList.remove('bg-editor', 'shadow-sm');
                editorContainer.classList.add('bg-dark-card', 'shadow-none');
                editorHeader.classList.remove('bg-gray-100', 'border-gray-200');
                editorHeader.classList.add('bg-dark-bg', 'border-dark-border');
                editorLabel.classList.remove('text-gray-600');
                editorLabel.classList.add('text-dark-text');
                countDisplay.classList.remove('text-gray-500');
                countDisplay.classList.add('text-dark-text/80');
                editor.classList.remove('bg-editor', 'text-sm');
                editor.classList.add('bg-dark-editor', 'text-dark-text', 'placeholder:text-dark-text/50');
                copyBtnEl.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                copyBtnEl.classList.add('bg-dark-hover', 'text-dark-text', 'hover:bg-dark-card');
                themeToggleBtn.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                themeToggleBtn.classList.add('bg-dark-hover', 'text-dark-text', 'hover:bg-dark-card');
                
                // 更新按钮文本和图标
                themeText.textContent = '日间模式';
                themeIcon.classList.remove('fa-moon-o');
                themeIcon.classList.add('fa-sun-o');
            } else {
                // 日间模式样式（恢复默认）
                appBody.classList.add('bg-gray-50', 'text-gray-800');
                appBody.classList.remove('bg-dark-bg', 'text-dark-text');
                header.classList.add('bg-white', 'shadow-sm');
                header.classList.remove('bg-dark-card', 'shadow-none', 'border-b', 'border-dark-border');
                headerTitle.classList.add('text-gray-800');
                headerTitle.classList.remove('text-dark-text');
                mainContent.classList.add('text-gray-800');
                mainContent.classList.remove('text-dark-text');
                editorContainer.classList.add('bg-editor', 'shadow-sm');
                editorContainer.classList.remove('bg-dark-card', 'shadow-none');
                editorHeader.classList.add('bg-gray-100', 'border-gray-200');
                editorHeader.classList.remove('bg-dark-bg', 'border-dark-border');
                editorLabel.classList.add('text-gray-600');
                editorLabel.classList.remove('text-dark-text');
                countDisplay.classList.add('text-gray-500');
                countDisplay.classList.remove('text-dark-text/80');
                editor.classList.add('bg-editor', 'text-sm');
                editor.classList.remove('bg-dark-editor', 'text-dark-text', 'placeholder:text-dark-text/50');
                copyBtnEl.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                copyBtnEl.classList.remove('bg-dark-hover', 'text-dark-text', 'hover:bg-dark-card');
                themeToggleBtn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                themeToggleBtn.classList.remove('bg-dark-hover', 'text-dark-text', 'hover:bg-dark-card');
                
                // 更新按钮文本和图标
                themeText.textContent = '夜间模式';
                themeIcon.classList.add('fa-moon-o');
                themeIcon.classList.remove('fa-sun-o');
            }
            
            // 保存主题偏好到本地存储
            localStorage.setItem('editorTheme', isDarkMode ? 'dark' : 'light');
        }

        // 绑定主题切换按钮事件
        themeToggleBtn.addEventListener('click', function() {
            toggleDarkMode();
        });
    </script>
</body>
</html>
