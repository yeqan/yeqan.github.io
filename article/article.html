<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <title>article</title>
</head>

<body>
  <div id="contentContainer"></div>
  <script src="../js/crypto-js.min.js"></script>
  <script>

    const params = new URLSearchParams(window.location.search);
    const path = params.get('path');
    const key = params.get('key');
    const download = params.get('download');
    const targetUrl = path + ".html";
    const contentContainer = document.getElementById("contentContainer")

    fetch(targetUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error("无法加载文件");
        }
        return response.text();
      })
      .then(html => {

        if (key !== null) {
          html = CryptoJS.DES.decrypt(html, key).toString(CryptoJS.enc.Utf8)
        }
        contentContainer.innerHTML = html;

        if (download !== null) {

          // 获取纯文本内容（innerText自动保留自然换行，去除所有HTML标签）
          let plainText = contentContainer.innerText;

          // 优化换行格式（统一换行符为\n，去除多余空行，使TXT更整洁）
          plainText = plainText
            .replace(/\r\n/g, '\n\n') // 替换Windows换行符为统一的\n
            .replace(/\r/g, '\n\n')   // 替换旧版Mac换行符为\n
            .replace(/\n+/g, '\n\n')  // 多个连续换行合并为一个
            .trim();                // 去除首尾空白行

          // 创建Blob对象（TXT格式，编码UTF-8）
          const blob = new Blob([plainText], {
            type: 'text/plain; charset=utf-8'
          });

          // 创建下载链接
          const downloadLink = document.createElement('a');
          // 生成Blob的临时URL
          downloadLink.href = URL.createObjectURL(blob);
          // 设置下载文件名
          downloadLink.download = download;
          // 触发下载（模拟点击链接）
          document.body.appendChild(downloadLink);
          downloadLink.click();
          // 清理资源（移除临时链接和Blob URL）
          document.body.removeChild(downloadLink);
          URL.revokeObjectURL(downloadLink.href);
        }
      })
      .catch(error => {
        console.error("加载失败：", error);
      });
  </script>
</body>

</html>
